spring:
  application:
    name: AviaParser
  datasource:
    url: jdbc:postgresql://localhost:5732/music-shop
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  redis:
    host: redis
    port: 6379
    password: ""
    timeout: 2000
base:
  url:
    site: https://www.muztorg.ru
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true